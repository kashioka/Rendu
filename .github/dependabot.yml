# Dependabot: 依存関係の脆弱性・更新を週次でチェックして PR を自動作成する。
# 監視対象: npm (ルート) / cargo (src-tauri) / GitHub Actions
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # dev 依存(ビルドツール/lint/テスト系)は minor+patch をまとめて 1 PR に。
      # 本体に載らないためリスクが低く、CI green なら丸ごとマージできる。
      npm-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # 本番依存(mermaid/react-markdown 等)は patch のみグループ化。
      # minor/major は個別 PR にして目視レビュー対象を絞る。
      npm-prod-patch:
        dependency-type: "production"
        update-types: ["patch"]
    ignore:
      # @tauri-apps/* は src-tauri 側の tauri crate とバージョン同期が必要
      # (mismatch すると tauri-action の release build が全 OS で失敗する)。
      # minor/major は手動で Rust 側と同時に上げる。
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # cargo は minor+patch をまとめて 1 PR に(tauri 本体は下の ignore で除外済)。
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # tauri 本体の minor/major は JS 側 @tauri-apps/* との同期が必要なため手動
      - dependency-name: "tauri"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "tauri-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      # Actions の minor+patch はまとめる。major(checkout v6→v7, tauri-action v0→v1 等)は
      # 個別 PR のまま残し、リリースへの影響を1件ずつ確認する。
      actions-minor-patch:
        update-types: ["minor", "patch"]
