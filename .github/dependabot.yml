# Dependabot: 依存関係の脆弱性・更新を週次でチェックして PR を自動作成する。
# 監視対象: npm (ルート) / cargo (src-tauri) / GitHub Actions
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # パッチ更新はまとめて 1 PR にしてレビュー負荷を下げる
      npm-patch:
        update-types: ["patch"]
    ignore:
      # @tauri-apps/* は src-tauri 側の tauri crate とバージョン同期が必要
      # (mismatch すると tauri-action の release build が全 OS で失敗する)。
      # minor/major は手動で Rust 側と同時に上げる。
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      cargo-patch:
        update-types: ["patch"]
    ignore:
      # tauri 本体の minor/major は JS 側 @tauri-apps/* との同期が必要なため手動
      - dependency-name: "tauri"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "tauri-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
