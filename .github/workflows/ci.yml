name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security-audit:
    name: Security audit (npm + cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # package-lock.json があれば node_modules 不要で audit できる
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # cargo audit は「脆弱性」検出時のみ exit≠0。GTK3 bindings の
      # unmaintained warning (RUSTSEC-2024-04xx, Tauri の Linux 依存チェーン
      # 由来で回避不能) は warning 扱いのため CI は落ちない。
      # --deny warnings は付けないこと (恒久的に赤になる)。
      - name: cargo audit (fail on vulnerabilities)
        working-directory: src-tauri
        run: cargo audit

  test-frontend:
    name: Frontend (TS / React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check version sync (package.json / tauri.conf.json / Cargo.toml)
        run: bash scripts/check-versions.sh

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  test-backend:
    name: Backend (Rust / Tauri)
    runs-on: ubuntu-22.04  # 22.04 でも webkit2gtk-4.1 は利用可（release-beta.yml で実証済）
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run cargo test
        working-directory: src-tauri
        run: cargo test --lib --verbose
